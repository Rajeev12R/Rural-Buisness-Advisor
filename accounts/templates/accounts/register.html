<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Entrepreneur Account - GramVikas Rural Business Advisor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.375rem;
        }
        form input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border-radius: 0.75rem;
            border: 1px solid #cbd5e1;
            font-size: 0.875rem;
            background-color: #ffffff;
            transition: all 0.15s ease-in-out;
        }
        form input:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }
        .helptext {
            display: block;
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }
        .errorlist {
            list-style: none;
            padding: 0;
            margin-bottom: 0.5rem;
            color: #dc2626;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="{% url 'home' %}" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white text-2xl shadow-sm">
                    🌾
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-slate-900 block leading-tight">GramVikas AI</span>
                    <span class="text-xs font-semibold text-brand-700 tracking-wide uppercase">Rural Business Advisory</span>
                </div>
            </a>
            <div>
                <a href="{% url 'home' %}" class="text-sm font-semibold text-slate-600 hover:text-slate-900">
                    &larr; Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Form -->
    <main class="flex-grow max-w-md w-full mx-auto px-4 sm:px-6 py-14">
        <div class="bg-white rounded-3xl border border-slate-200/80 p-8 sm:p-10 shadow-lg shadow-slate-200/40">
            
            <div class="mb-8 text-center">
                <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-700 flex items-center justify-center text-2xl mx-auto mb-4 font-bold">
                    🚀
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create Your Account</h1>
                <p class="text-sm text-slate-500 mt-1">
                    Join rural entrepreneurs making data-backed business decisions across India.
                </p>
            </div>

            <!-- Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="pt-4">
                    <button type="submit" class="w-full inline-flex items-center justify-center px-6 py-3.5 rounded-xl text-sm font-bold text-white bg-brand-700 hover:bg-brand-800 shadow-md shadow-brand-700/20 transition-all transform hover:-translate-y-0.5">
                        Register & Start Advisory &rarr;
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center border-t border-slate-100 pt-6">
                <p class="text-xs text-slate-500">
                    Already registered? 
                    <a href="{% url 'login' %}" class="font-bold text-brand-700 hover:underline">
                        Sign in to account
                    </a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            <p>GramVikas AI Advisory Platform &bull; Built with Django & LangGraph</p>
        </div>
    </footer>

</body>
</html>
